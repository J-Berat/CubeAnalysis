# All relative paths are resolved from this parameter file.
[run]
# Relative to this file; point it at one directory of cubes.
input_dir = "../data/example_simulation"
output_dir = "../outputs/example"
formats = ["png", "pdf"]
overwrite = true
atomic_directory = true
save_data = false # set true only when CSV/TOML outputs are explicitly wanted
sample_stride = 37
field_by_field = true
# Set to 0 for unlimited. FFT/HRO stages fail early if their working set is larger.
memory_budget_gb = 0

[grid]
box_size = [50.0, 50.0, 50.0]
axis_order = ["x", "y", "z"]
box_unit = "pc"
periodic = true

[render]
width = 1400
height = 900
fontsize = 18
colormap = "viridis"
quantile_low = 0.005
quantile_high = 0.995

[plots]
summary = true
quality = true
slices = true
projections = true
histograms = true
phase_diagrams = true
relations = true
power_spectra = true
alignments = true
vector_spectra = true
cross_spectra = true
advanced_diagnostics = true
physics_table = true # Mach, Alfvenic Mach, beta, dB/|<B>|, dv/|<v>|
density_pdf = true # lognormal fit and the driving parameter b
phase_budget = true # volume and mass filling factors per thermal phase
column_density_pdf = true # N-PDF with a power-law tail fit
phase_diagnostics = true
synthetic_observations = true
topology = true
anisotropic_spectra = true
directional_structure_functions = true

[slices]
axes = ["x", "y", "z"]
positions = [0.25, 0.50, 0.75]
# Optional: restrict to selected fields, e.g. fields = ["density", "Bmag"]

[projections]
axes = ["x", "y", "z"]
statistics = ["mean", "sum", "max"]
column_density_fields = ["density"]
# Optional: fields = ["density", "temperature", "Bmag", "Vmag"]

[histograms]
bins = 80
normalize = true
# Optional: fields = ["density", "temperature", "Bmag", "Vmag"]

[[histograms.groups]]
name = "magnetic_components"
fields = ["Bx", "By", "Bz"]
xlabel = "B"

[[histograms.groups]]
name = "velocity_components"
fields = ["Vx", "Vy", "Vz"]
xlabel = "v"

[spectra]
bins = 80
remove_mean = true
fields = ["density", "temperature", "Bmag", "Vmag"]
# "energy" is E(k) = shell sum / dk and is the only normalisation comparable
# with the Kolmogorov k^-5/3 and Burgers k^-2 references, because the bins are
# logarithmic. "shell" is the raw sum (slope +1); "average" is per mode (-2).
quantity = "energy"
compensation = 0.0
fit_range = [0.2, 10.0]
injection_modes = 4.0 # injection-dominated modes k/k_min <= 4
dissipation_cells = 4.0 # shade wavelengths resolved by fewer than four cells
# For non-periodic grids the default is "hann"; otherwise "none".
window = "none"
velocity_fields = ["Vmag"]
velocity_reference_slopes = [-1.6666666667, -2.0]
reference_range = [0.2, 10.0]
auto_fit_range = true
auto_fit_min_points = 6
auto_fit_min_decades = 0.35
auto_fit_min_r2 = 0.95

[[cross_spectra]]
name = "density_magnetic_magnitude"
first = "density"
second = "Bmag"
bins = 80

[[vector_spectra]]
name = "magnetic"
components = ["Bx", "By", "Bz"]
bins = 80

[[vector_spectra]]
name = "velocity"
components = ["Vx", "Vy", "Vz"]
bins = 80
reference_slopes = [-1.6666666667, -2.0]
reference_range = [0.2, 10.0]

[[vector_spectra]]
name = "vorticity"
components = ["Vx", "Vy", "Vz"]
transform = "curl"
bins = 80

[[anisotropic_spectra]]
name = "density_relative_to_mean_B"
field = "density"
guide_fields = ["Bx", "By", "Bz"]
parallel_bins = 32
perpendicular_bins = 32
radial_bins = 40

[[directional_structure_functions]]
name = "velocity_directional"
components = ["Vx", "Vy", "Vz"]
orders = [1, 2, 3, 4]
fit_range = [0.2, 10.0]

[[directional_structure_functions]]
name = "density_weighted_velocity_directional"
components = ["Vx", "Vy", "Vz"]
weight_field = "density"
weight_power = 0.3333333333333333
orders = [1, 2, 3]
fit_range = [0.2, 10.0]
auto_fit_range = true

[[topology]]
name = "dense_gas_excursions"
field = "density"
quantiles = [0.50, 0.70, 0.80, 0.90, 0.95, 0.99]
above = true

[[vector_spectra]]
name = "kinetic"
components = ["Vx", "Vy", "Vz"]
weight_field = "density"
weight_power = 0.5 # spectrum of sqrt(rho) v
bins = 80

[diagnostics]
structure_fields = ["density", "Vmag"]
structure_orders = [1, 2, 3]
structure_samples = 100000
# Fits inherit spectra.injection_modes and spectra.dissipation_cells.
phase_ess = true
phase_ess_orders = [1, 2, 3, 4, 5]
phase_ess_samples = 100000
phase_ess_bootstrap_replicates = 200
phase_ess_temperature = "temperature"
phase_ess_velocity = ["Vx", "Vy", "Vz"]
correlation_fields = ["density", "Bmag"]
correlation_bins = 60
density_pdf_bins = 80
column_density_axes = ["x", "y", "z"]
column_density_bins = 60
physics = true
phase_diagnostics = true
phase_increment_samples = 50000
bootstrap_blocks_per_axis = 4
bootstrap_replicates = 200
density = "density"
temperature = "temperature"
velocity = ["Vx", "Vy", "Vz"]
magnetic = ["Bx", "By", "Bz"]
mean_molecular_weight = 1.27
velocity_to_cms = 1.0e5
magnetic_to_gauss = 1.0e-3

[synthetic_observations]
density = "density"
velocity = ["Vx", "Vy", "Vz"]
magnetic = ["Bx", "By", "Bz"]
lines_of_sight = ["x", "y", "z"]
velocity_channels = 64
linewidth_sizes = [4, 8, 16, 32, 64]

[[diagnostics.phases]]
name = "CNM"
temperature_min = 0.0
temperature_max = 300.0

[[diagnostics.phases]]
name = "UNM"
temperature_min = 300.0
temperature_max = 5000.0

[[diagnostics.phases]]
name = "WNM"
temperature_min = 5000.0
temperature_max = 1.0e30

# Each field points to one 3-D FITS cube.
[fields.density]
file = "density.fits"
label = "number density"
unit = "cm^-3"
log = true
colormap = "magma"

[fields.temperature]
file = "temperature.fits"
label = "temperature"
unit = "K"
log = true
colormap = "inferno"

[fields.Bx]
file = "Bx.fits"
label = "B_x"
unit = "mG"
log = false

[fields.By]
file = "By.fits"
label = "B_y"
unit = "mG"
log = false

[fields.Bz]
file = "Bz.fits"
label = "B_z"
unit = "mG"
log = false

[fields.Vx]
file = "Vx.fits"
label = "v_x"
unit = "km/s"
log = false

[fields.Vy]
file = "Vy.fits"
label = "v_y"
unit = "km/s"
log = false

[fields.Vz]
file = "Vz.fits"
label = "v_z"
unit = "km/s"
log = false

[[derived.vectors]]
name = "Bmag"
components = ["Bx", "By", "Bz"]
factor = 1000.0
label = "|B|"
unit = "microG"
log = true
colormap = "plasma"

[[derived.vectors]]
name = "Vmag"
components = ["Vx", "Vy", "Vz"]
factor = 1.0
label = "|v|"
unit = "km/s"
log = true
colormap = "viridis"

[[derived.products]]
name = "pressure_over_k"
factors = ["density", "temperature"]
factor = 1.0
label = "P/k_B"
unit = "K cm^-3"
log = true
colormap = "thermal"

[[phase_diagrams]]
name = "density_temperature"
x = "density"
y = "temperature"
bins = 160
log_x = true
log_y = true
thermal_overlay = "temperature"
isotherms = [100.0, 1000.0, 8000.0]
isotherm_colors = ["yellow", "orange", "red"] # cold to hot

[[phase_diagrams]]
name = "density_pressure"
x = "density"
y = "pressure_over_k"
bins = 160
log_x = true
log_y = true
thermal_overlay = "pressure"
isotherms = [100.0, 1000.0, 8000.0]
isotherm_colors = ["yellow", "orange", "red"] # cold to hot

[[relations]]
name = "magnetic_field_vs_density"
x = "density"
y = "Bmag"
bins = 30
minimum_per_bin = 100
weighting = "uniform" # or "gradient"
angle_coordinate = "cosine" # or "degrees"
bootstrap_replicates = 200
bootstrap_seed = 1234
log_x = true
log_y = true

[[relations]]
name = "velocity_vs_density"
x = "density"
y = "Vmag"
bins = 30
minimum_per_bin = 100
log_x = true
log_y = true

[[alignments]]
name = "density_gradient_vs_B"
scalar = "density"
vector = ["Bx", "By", "Bz"]
velocity_vector = ["Vx", "Vy", "Vz"]
condition = "density"
condition_bins = 12
angle_bins = 30
minimum_per_bin = 100
xi_plot = true
xi_bins = 25
xi_density_range = [1.0e-2, 1.0e3]
xi_minimum_per_bin = 1000
xi_blocks_per_axis = 4
xi_cosine_bins = 40
xi_parallel_cosine = 0.75
xi_perpendicular_cosine = 0.25
xi_gradient_periodic = false # matches Desktop/alignement B_n
